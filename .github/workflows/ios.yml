name: ios

# À chaque push : vérifie que l'appli iOS compile (simulateur, sans signature).
# À la demande (onglet Actions → ios → Run workflow, case « TestFlight » cochée) :
# signe l'appli et l'envoie sur TestFlight / App Store Connect.
#
# Secrets GitHub nécessaires pour l'envoi (Settings → Secrets and variables → Actions) :
#   APPLE_TEAM_ID           identifiant d'équipe (10 caractères), developer.apple.com → Membership
#   ASC_KEY_ID              ID de la clé API App Store Connect (rôle Admin)
#   ASC_ISSUER_ID           Issuer ID affiché au-dessus de la liste des clés
#   ASC_KEY_P8              contenu complet du fichier AuthKey_XXXX.p8
# Variable (non secrète) facultative :
#   MASALA_SERVER           adresse HTTPS du serveur du compte epices, intégrée à l'appli

on:
  push:
    paths: ["app/**", "shared/**", "ios/**", "tools/build-web.mjs", "capacitor.config.json", "package*.json", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Signer et envoyer sur TestFlight"
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-15
    env:
      MASALA_SERVER: ${{ vars.MASALA_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }

      - name: Préparer l'appli web et synchroniser le projet iOS
        run: |
          npm ci
          npm run ios:sync

      - name: Compiler (simulateur, sans signature)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.testflight) }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Clé App Store Connect
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "::error::Secret ASC_KEY_P8 manquant (voir le haut de ce fichier)"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Archiver et envoyer sur TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          BUILD=$(( 100 + ${{ github.run_number }} ))
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Masala.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$BUILD \
            $AUTH archive | tail -n 40
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Masala.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export $AUTH
          echo "Build $BUILD envoyé : il apparaît dans App Store Connect → TestFlight après le traitement par Apple (10-30 min)."
